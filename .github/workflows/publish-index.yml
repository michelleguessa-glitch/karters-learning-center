name: Publish index
on:
  push:
    paths:
      - .github/workflows/publish-index.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with final build
        run: |
          git config user.name "michelleguessa-glitch"
          git config user.email "michelleguessa-glitch@users.noreply.github.com"
          rm -f index.html
          mv math-and-spelling-pwa.html index.html
          git add -A
          git commit -m "Publish final build as index.html"
          git push
