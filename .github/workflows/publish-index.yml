name: Publish index

on:
  push:
    paths:
      - '.github/workflows/publish-index.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish newest build as index.html
        run: |
          mv -f math-and-spelling-pwa.html index.html
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Publish newest build as index.html"
          git push
