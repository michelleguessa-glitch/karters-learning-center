name: Publish index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish newest build as index.html
        run: |
          if [ -f math-and-spelling-pwa.html ]; then mv -f math-and-spelling-pwa.html index.html; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish newest build as index.html"
          git push
