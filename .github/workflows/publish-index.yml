name: Publish index
on:
  push:
    paths:
      - .github/workflows/publish-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded build to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv math-and-spelling-pwa.html index.html
          git add -A
          git commit -m "Publish final build as index.html"
          git push
