name: Publish build as index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move build to index.html
        run: |
          git config user.name "michelleguessa-glitch"
          git config user.email "michelleguessa-glitch@users.noreply.github.io"
          git mv math-and-spelling-pwa.html index.html
          git commit -m "Sport switcher + gymnastics + venues"
          git push
