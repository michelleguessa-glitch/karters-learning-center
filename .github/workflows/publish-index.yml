name: Publish index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file to index.html
        run: |
          mv math-and-spelling-pwa.html index.html
          git config user.name "michelleguessa-glitch"
          git config user.email "michelleguessa-glitch@users.noreply.github.com"
          git add -A
          git commit -m "Publish final build as index.html" || echo "nothing to commit"
          git push
