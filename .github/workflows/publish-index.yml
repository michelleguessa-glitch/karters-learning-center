name: Publish new build as index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the new build
        run: |
          set -e
          test -f math-and-spelling-pwa.html
          cp math-and-spelling-pwa.html index.html
          rm math-and-spelling-pwa.html
          git config user.name "michelleguessa-glitch"
          git config user.email "michelleguessa-glitch@users.noreply.github.com"
          git add -A
          git commit -m "Publish Karter's newest build as index.html"
          git push
