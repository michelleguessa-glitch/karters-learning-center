name: Publish index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish final build as index.html
        run: |
          mv -f math-and-spelling-pwa.html index.html
          git add -A
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish final build as index.html" || echo "nothing to commit"
          git push
