name: Publish newest build as index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded build to index.html
        run: |
          mv -f math-and-spelling-pwa.html index.html
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish newest build as index.html" || echo "No changes to commit"
          git push
